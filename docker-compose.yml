services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nft
      POSTGRES_PASSWORD: nft
      POSTGRES_DB: nftstudio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://nft:nft@postgres:5432/nftstudio
      REDIS_URL: redis://redis:6379/0
      EMBED_WORKER: "0"
      SEED_DEMO: "1"
      SECRET_KEY: change-me
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:8000
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
  worker:
    build: ./apps/api
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://nft:nft@postgres:5432/nftstudio
      REDIS_URL: redis://redis:6379/0
      EMBED_WORKER: "0"
      SEED_DEMO: "0"
      SECRET_KEY: change-me
      STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: http://localhost:8000
    volumes:
      - storage:/data/storage
    depends_on:
      - api
      - redis
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
